name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Tests
    # GDB 17+ is needed for literal argv with startup-with-shell off.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      TERM: xterm-256color
      CPPFLAGS: -D_FORTIFY_SOURCE=3
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libncurses-dev libelf-dev libjson-c-dev \
            gdb gdbserver tmux ncurses-term openocd
      - name: Run test suites
        run: |
          set -o pipefail
          mkdir -p build/ci
          gdb --version
          make test test-native test-tmux test-m15-native \
            test-m16-server test-m16-tui test-m16-openocd \
            2>&1 | tee build/ci/tests.log
      - name: Retain test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs
          path: build/ci/*.log
          if-no-files-found: ignore
          retention-days: 7

  analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libncurses-dev libelf-dev libjson-c-dev \
            clang-tidy
      - name: Run static analysis
        run: |
          set -o pipefail
          mkdir -p build/ci
          clang-tidy --version
          make analyze 2>&1 | tee build/ci/analysis.log
      - name: Compile tests with fortification
        run: |
          set -o pipefail
          sources=(tests/unit/*.c tests/integration/*.c tests/support/*.c)
          objects=("${sources[@]/%.c/.o}")
          objects=("${objects[@]/#/build/}")
          make CPPFLAGS=-D_FORTIFY_SOURCE=3 "${objects[@]}" \
            2>&1 | tee build/ci/test-compilation.log
      - name: Retain analysis log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analysis-log
          path: build/ci/*.log
          if-no-files-found: ignore
          retention-days: 7
